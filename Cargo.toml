[package]
name = "codex-unlock-agent-rust"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "CodexUnlockAgent"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
